name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan hjhart.com >> ~/.ssh/known_hosts

      - name: Generate resume HTML and PDF
        run: |
          touch resumes/resume.html resumes/resume.pdf
          docker compose -f resume/docker-compose.yml run --rm resume \
            ./node_modules/.bin/resume export --theme short resume.html
          # resume-cli swallows PDF errors and exits 0, leaving an empty file,
          # so render the PDF from the HTML with the runner's Chrome instead.
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf="$PWD/resumes/resume.pdf" "file://$PWD/resumes/resume.html"
          test -s resumes/resume.html || { echo "resume.html is empty"; exit 1; }
          test -s resumes/resume.pdf || { echo "resume.pdf is empty"; exit 1; }

      - name: Build Jekyll site
        run: docker compose run --rm app bundle exec jekyll build

      - name: Deploy to server
        run: rsync -avz --delete _site/ deploy@hjhart.com:/home/www/hjhart_com/_site/
